<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>영업이슈 뉴스</title>
<style>
  :root{
    --canvas:#faf9f5; --card:#efe9de; --hairline:#d8d2c5;
    --ink:#141413; --body:#2a2a28; --muted:#5a5853;
    --blue:#003CDC; --spring:#5BC2E7; --coral:#cc785c;
    --font: system-ui, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{
    margin:0; background:var(--canvas); color:var(--body);
    font-family:var(--font); font-size:18px; line-height:1.6;
    padding-bottom:env(safe-area-inset-bottom);
  }

  /* ── 헤더 + 필터: 각각 top:0 으로 붙이면 필터가 헤더 뒤로 숨는다. 하나로 묶어 고정한다. */
  .top{position:sticky; top:0; z-index:9}
  header{
    background:var(--blue); color:#fff;
    padding:14px 18px calc(14px + env(safe-area-inset-top)) 18px;
    padding-top:calc(14px + env(safe-area-inset-top));
    display:flex; align-items:baseline; justify-content:space-between; gap:12px;
  }
  header h1{margin:0; font-size:21px; font-weight:800; letter-spacing:-.01em}
  header time{font-size:14px; opacity:.85; white-space:nowrap; font-variant-numeric:tabular-nums}

  /* ── 토픽 필터 */
  nav{
    background:var(--canvas); border-bottom:1px solid var(--hairline);
    display:flex; gap:8px; overflow-x:auto; padding:12px 18px;
    scrollbar-width:none;
  }
  nav::-webkit-scrollbar{display:none}
  nav button{
    flex:0 0 auto; min-height:40px; padding:6px 15px; border-radius:999px; cursor:pointer;
    border:1px solid var(--hairline); background:transparent; color:var(--muted);
    font-family:inherit; font-size:15px; font-weight:600; white-space:nowrap;
  }
  nav button[aria-pressed="true"]{background:var(--blue); border-color:var(--blue); color:#fff}
  nav button b{font-weight:600; opacity:.7; margin-left:4px; font-variant-numeric:tabular-nums}

  /* ── 카드 */
  main{padding:16px 18px 8px; display:flex; flex-direction:column; gap:14px}
  article{
    background:var(--card); border:1px solid var(--hairline); border-radius:12px;
    padding:18px 18px 12px;
  }
  .tags{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px}
  .tag{
    font-size:11px; font-weight:700; letter-spacing:.15em; text-transform:uppercase;
    color:var(--coral); border:1px solid currentColor; border-radius:999px; padding:3px 9px;
  }
  h2{margin:0 0 8px; font-size:22px; line-height:1.35; font-weight:800; color:var(--ink); letter-spacing:-.01em}
  h2 a{color:inherit; text-decoration:none}
  .snippet{margin:0 0 10px; font-size:17px; color:var(--body)}
  .meta{font-size:14px; color:var(--muted); border-top:1px solid var(--hairline); padding-top:10px;
        display:flex; align-items:center; gap:10px; flex-wrap:wrap}
  .meta .press{font-weight:700; color:var(--body)}
  .actions{margin-left:auto; display:flex; gap:8px}
  .actions button, .actions a{
    min-height:40px; display:inline-flex; align-items:center; padding:6px 14px; border-radius:8px;
    border:1px solid var(--blue); background:transparent; color:var(--blue);
    font-family:inherit; font-size:15px; font-weight:700; cursor:pointer; text-decoration:none;
  }
  .actions button.done{background:var(--spring); border-color:var(--spring); color:var(--ink)}

  /* ── 상태·각주 */
  .state{padding:48px 18px; text-align:center; color:var(--muted); font-size:17px}
  footer{
    padding:20px 18px 40px; margin-top:12px; border-top:1px solid var(--hairline);
    font-size:14px; line-height:1.7; color:var(--muted);
  }
  footer p{margin:0 0 6px}
  @media (min-width:720px){
    header,nav{max-width:720px; margin-inline:auto}
    main,footer{max-width:720px; margin-inline:auto}
  }
</style>
</head>
<body>

<div class="top">
  <header>
    <h1>영업이슈 뉴스</h1>
    <time id="updated"></time>
  </header>
  <nav id="filters" aria-label="영업이슈 필터"></nav>
</div>
<main id="list"><p class="state">불러오는 중…</p></main>

<footer>
  <p>기사 제목·발췌·링크만 제공하며 본문을 재배포하지 않습니다. 내용은 각 언론사의 것이며 삼성화재의 공식 입장이 아닙니다.</p>
  <p>상품 보장내용·지급기준은 반드시 해당 약관과 상품설명서로 확인하십시오.</p>
  <p id="src"></p>
</footer>

<script>
const $ = (s) => document.querySelector(s)
let DATA = null, ACTIVE = 'all'

const ago = (iso) => {
  const m = (Date.now() - Date.parse(iso)) / 60000
  if (m < 60) return `${Math.max(1, Math.round(m))}분 전`
  if (m < 1440) return `${Math.round(m / 60)}시간 전`
  return `${Math.round(m / 1440)}일 전`
}
const stamp = (iso) => {
  const d = new Date(iso)
  const p = (n) => String(n).padStart(2, '0')
  return `${p(d.getMonth() + 1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())} 기준`
}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))

function renderFilters() {
  const shown = DATA.topics.filter((t) => t.count > 0)
  const all = [{ id: 'all', label: '전체', count: DATA.items.length }, ...shown]
  $('#filters').innerHTML = all.map((t) =>
    `<button data-id="${t.id}" aria-pressed="${t.id === ACTIVE}">${esc(t.label)}<b>${t.count}</b></button>`
  ).join('')
  // 필터를 고르면 그 칩이 화면 밖으로 밀려 있을 수 있다. 끌어다 놓는다.
  $('#filters [aria-pressed="true"]')?.scrollIntoView({ block: 'nearest', inline: 'center' })
}

function renderList() {
  const labels = Object.fromEntries(DATA.topics.map((t) => [t.id, t.label]))
  const items = ACTIVE === 'all' ? DATA.items : DATA.items.filter((i) => i.topics.includes(ACTIVE))
  if (!items.length) { $('#list').innerHTML = '<p class="state">이 이슈에 걸린 기사가 아직 없습니다.</p>'; return }

  $('#list').innerHTML = items.map((i) => `
    <article>
      <div class="tags">${i.topics.map((t) => `<span class="tag">${esc(labels[t] || t)}</span>`).join('')}</div>
      <h2><a href="${esc(i.url)}" target="_blank" rel="noopener noreferrer">${esc(i.title)}</a></h2>
      ${i.summary ? `<p class="snippet">${esc(i.summary)}</p>` : ''}
      <div class="meta">
        <span class="press">${esc(i.press)}</span>
        <span>${ago(i.publishedAt)}</span>
        ${i.others ? `<span>외 ${i.others}개 매체</span>` : ''}
        <span class="actions">
          <a href="${esc(i.url)}" target="_blank" rel="noopener noreferrer">원문 ↗</a>
          <button type="button" data-copy="${esc(i.title)}\n${esc(i.press)}\n${esc(i.url)}">복사</button>
        </span>
      </div>
    </article>`).join('')
}

$('#filters').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return
  ACTIVE = b.dataset.id
  renderFilters(); renderList(); scrollTo({ top: 0, behavior: 'smooth' })
})

$('#list').addEventListener('click', async (e) => {
  const b = e.target.closest('button[data-copy]'); if (!b) return
  try {
    await navigator.clipboard.writeText(b.dataset.copy)
    b.textContent = '복사됨'; b.classList.add('done')
    setTimeout(() => { b.textContent = '복사'; b.classList.remove('done') }, 1600)
  } catch {
    b.textContent = '복사 실패'
    setTimeout(() => { b.textContent = '복사' }, 1600)
  }
})

// 캐시된 옛 파일을 잡지 않도록 쿼리를 붙인다.
fetch('news.json?t=' + Date.now())
  .then((r) => r.json())
  .then((d) => {
    DATA = d
    $('#updated').textContent = stamp(d.updatedAt)
    $('#updated').dateTime = d.updatedAt
    $('#src').textContent = '출처: 구글 뉴스' + (d.naver ? ' · 네이버 뉴스검색' : '')
    renderFilters(); renderList()
  })
  .catch(() => { $('#list').innerHTML = '<p class="state">기사를 불러오지 못했습니다. 잠시 후 새로고침해 주세요.</p>' })
</script>
</body>
</html>
